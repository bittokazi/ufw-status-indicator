name: Build GNOME Extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNOME Shell extension tools
        run: sudo apt update && sudo apt install -y gnome-shell-extensions gnome-shell-extension-prefs

      - name: Package extension
        run: |
          gnome-extensions pack ufw-status-indicator@bittokazi.com/
          mv ufw-status-indicator@bittokazi.com.shell-extension.zip ufw-status-indicator@bittokazi.com-${{ github.ref_name }}.zip

      - name: Upload as GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ufw-status-indicator@bittokazi.com-${{ github.ref_name }}.zip